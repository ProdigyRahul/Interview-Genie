services:
  app:
    container_name: interview-genie-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - NODE_ENV=development
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      - NEXTAUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - AUTH_TRUST_HOST=true
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/interview_genie
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./next.config.js:/app/next.config.js
      - ./.env.local:/app/.env.local
      - ./prisma:/app/prisma
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - interview-genie-network
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: interview-genie-db
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=interview_genie
    volumes:
      - interview-genie-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - interview-genie-network

networks:
  interview-genie-network:
    driver: bridge

volumes:
  interview-genie-db-data:
    driver: local 